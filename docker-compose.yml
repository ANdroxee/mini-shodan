services:
  # Base de données (schéma créé automatiquement par l'API et le scanner)
  postgres:
    image: postgres:15-alpine
    container_name: shodan_postgres
    environment:
      POSTGRES_USER: shodan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shodan123}
      POSTGRES_DB: shodan_home
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Uniquement en local : le scanner (réseau de l'hôte) s'y connecte par 127.0.0.1
      - "127.0.0.1:5432:5432"
    networks:
      - shodan_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shodan"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # API
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: shodan_api
    environment:
      DATABASE_URL: "postgres://shodan:${POSTGRES_PASSWORD:-shodan123}@postgres:5432/shodan_home?sslmode=disable"
      PORT: "8080"
      # Affichés dans l'interface (doivent correspondre au scanner)
      SCAN_TARGET: "${SCAN_TARGET:-192.168.1.0/24}"
      SCAN_SCHEDULE: "${SCAN_SCHEDULE:-0 3 * * *}"
      SCAN_TIMEZONE: "${SCAN_TIMEZONE:-Europe/Paris}"
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - shodan_net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Scanner : tourne en boucle (planning + scans demandés depuis l'interface)
  scanner:
    build:
      context: .
      dockerfile: Dockerfile.scanner
    container_name: shodan_scanner
    environment:
      DATABASE_URL: "postgres://shodan:${POSTGRES_PASSWORD:-shodan123}@127.0.0.1:5432/shodan_home?sslmode=disable"
      SCAN_TARGET: "${SCAN_TARGET:-192.168.1.0/24}"
      SCAN_SCHEDULE: "${SCAN_SCHEDULE:-0 3 * * *}"
      SCAN_TIMEZONE: "${SCAN_TIMEZONE:-Europe/Paris}"
      WORKERS: "${WORKERS:-10}"
      RUN_ON_START: "true"
    # Réseau de l'hôte : nécessaire pour voir les appareils du réseau local (et leurs adresses MAC)
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Interface web (nginx relaie /api vers l'API)
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: shodan_frontend
    ports:
      - "3000:3000"
    networks:
      - shodan_net
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  shodan_net:
    driver: bridge
